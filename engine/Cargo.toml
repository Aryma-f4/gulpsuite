[package]
name = "gulpsuite"
version = "0.2.0"
edition = "2021"

[lib]
name = "gulpsuite"
path = "src/lib.rs"

[[bin]]
name = "gulpsuite"
path = "src/bin/gulpsuite.rs"

[[bin]]
name = "gulpsuite-engine"
path = "src/bin/gulpsuite-engine.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "io-std", "time"] }
serde_json = "1"
regex = "1"
eframe = "0.33"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
webpki-roots = "1"

[dev-dependencies]
egui_kittest = { version = "=0.33.3", features = ["eframe", "snapshot", "wgpu"] }

[profile.release]
opt-level = 2
